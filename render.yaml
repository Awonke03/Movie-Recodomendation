services:
  - type: web
    name: cinematch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train_recommender.py
    startCommand: gunicorn --workers 1 --threads 4 --timeout 45 --bind 0.0.0.0:$PORT movie_recommendation:app
    healthCheckPath: /health
    envVars:
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: PYTHON_VERSION
        value: 3.12.10
